{% extends "base.html" %}
{% load static %}
{% block scripts %}
<script src="{% static 'polls/js/validate.js' %}" defer></script>
{% endblock %}

{% block content %}
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <symbol id="exclamation-triangle-fill" viewBox="0 0 16 16">
      <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 
      1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 
      3.507a.552.552 0 0 1-1.1 0L7.1 
      5.995A.905.905 0 0 1 8 5zm.002 
      6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
    </symbol>
  </svg>
  <form action="{% url 'polls:vote' question.id %}" method="post">
    {% csrf_token %}
    <fieldset class="mb-3">
      <legend><h1>{{question.question_text}}</h1></legend>
      {% if error_message %}
      <div class="alert alert-danger d-flex align-items-center" role="alert">
        <svg class="bi flex-shrink-0 me-2" width="20" height="20"role="img" aria-label="Danger:"><use xlink:href="#exclamation-triangle-fill"/></svg>
        <span class="alert-text">{{error_message}}</span>
      </div>
      {% endif %} {% for choice in question.choice_set.all %}
      <div class="form-check mb-2 fs-4">
        <input
          class="form-check-input"
          type="radio"
          name="choice"
          id="choice{{ forloop.counter }}"
          value="{{choice.id}}"  
        />
        <label class="form-check-label" for="choice{{ forloop.counter }}">{{choice.choice_text}}</label
        ><br />
      </div>

      {% endfor %}
    </fieldset>
    <input class="btn btn-primary" type="submit" value="投票する" />
  </form>
{% endblock %}

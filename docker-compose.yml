services:
  # nginx:
  #   image: nginx:1.29.0
  #   container_name: nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
  #     - static_volume:/usr/src/app/staticfiles
  #   depends_on:
  #     - web

  web:
    build: ./web
    container_name: django
    # command: gunicorn mysite.wsgi:application --bind 0.0.0.0:8000
    command: sh -c "while true; do sleep 1000; done" #　開発中のみ
    volumes:
      - ./web:/usr/src/app
      - ./secrets:/usr/src/app/secrets:ro
      - static_volume:/usr/src/app/staticfiles
    expose:
      - "8000"
    depends_on:
      - db
    environment:
      - PGSERVICEFILE=/usr/src/app/secrets/.pg_service.conf
      - PGSERVICE=my_service
    ports:
      - "8000:8000" # 開発中のみ

  db:
    image: postgres:15.13
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=django-tutorial
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  static_volume:
